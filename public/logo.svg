<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <linearGradient id="solarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98" />
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Precision Cardinal Coordinate Crosshairs -->
  <line x1="60" y1="2" x2="60" y2="10" stroke="url(#cyberCyan)" stroke-width="1.8" />
  <line x1="60" y1="110" x2="60" y2="118" stroke="url(#cyberCyan)" stroke-width="1.8" />
  <line x1="2" y1="60" x2="10" y2="60" stroke="url(#cyberCyan)" stroke-width="1.8" />
  <line x1="110" y1="60" x2="118" y2="60" stroke="url(#cyberCyan)" stroke-width="1.8" />

  <!-- Outer Precision Calibration Ring -->
  <circle cx="60" cy="60" r="54" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" stroke-dasharray="4 6" />

  <!-- Outer Hexagonal Kinetic Armor -->
  <polygon points="60,14 100,37 100,83 60,106 20,83 20,37" fill="url(#darkArmor)" stroke="url(#titanium)" stroke-width="2" stroke-linejoin="round" />

  <!-- Isometric Facet Top -->
  <polygon points="60,14 100,37 60,60 20,37" fill="url(#neonEmerald)" fill-opacity="0.22" stroke="url(#neonEmerald)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Isometric Facet Left Bottom -->
  <polygon points="20,37 60,60 60,106 20,83" fill="url(#cyberCyan)" fill-opacity="0.18" stroke="url(#cyberCyan)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Isometric Facet Right Bottom -->
  <polygon points="100,37 100,83 60,106 60,60" fill="url(#solarAmber)" fill-opacity="0.15" stroke="url(#solarAmber)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- 7-DOF Articulated Joint Glyph ("553" Kinematic Path) -->
  <path d="M60 26 L88 42 L88 60 L60 78 L38 65 L38 50 L60 38 Z" fill="none" stroke="url(#titanium)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Optical Sensor Reticle -->
  <path d="M46 60 H74 M60 46 V74" stroke="url(#cyberCyan)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3" />

  <!-- Center Quantum Beacon -->
  <circle cx="60" cy="60" r="6" fill="url(#neonEmerald)" filter="url(#coreGlow)" />
  <circle cx="60" cy="60" r="2.5" fill="#ffffff" />

  <!-- Orbital Sensor Ring -->
  <circle cx="60" cy="60" r="19" stroke="url(#neonEmerald)" stroke-width="0.8" stroke-dasharray="3 5" stroke-opacity="0.7" />
</svg>
